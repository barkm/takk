# Build and deploy the API, from a Cloud Build trigger connected to this repository (step 18 of
# ROADMAP-takk.md). Nothing about GCP lives in GitHub: the trigger holds the substitutions and Cloud
# Build's own service account holds the credentials.
#
# The image needs the serving bundle, which is not in the repository - it is built from the datasets
# on the training machine and uploaded with `scripts/build_serving.py --publish`. What is committed
# is deploy/bundle.txt, the archive's name and digest, so a push of that file is what deploys a new
# model and the history says which one each revision served.
#
# Substitutions the trigger sets: _BUNDLE_URI (gs://<bucket>/<prefix>, kept out of the repository),
# _REGION, _REPO, _SERVICE, _RUNTIME_SA, _SECRET, _MIN_INSTANCES.
substitutions:
  _REGION: europe-north1
  _REPO: takk
  _SERVICE: takk
  _SECRET: takk-anthropic
  _MIN_INSTANCES: "0"
  # Which origins may call the API. The deployed page, and a development page pointed at this service
  # with VITE_API_BASE; everything else calls it from a terminal, where CORS does not apply anyway.
  _ORIGINS: https://barkm.se,http://localhost:5173

steps:
  # The bundle the pin names, verified against the digest beside it: the archive is content-addressed,
  # so a mismatch means the object was replaced and the build must not deploy it.
  - id: bundle
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    # Through the environment, because a substitution is only replaced where it is written exactly
    # as $_NAME: inside ${_BUNDLE_URI%/} it is left alone and bash then sees an unset variable.
    env: ["BUNDLE_URI=${_BUNDLE_URI}"]
    args:
      - -c
      - |
        set -euo pipefail
        read -r name digest < deploy/bundle.txt
        gcloud storage cp "${BUNDLE_URI%/}/$name" /workspace/bundle.tar.gz
        echo "${digest#sha256:}  /workspace/bundle.tar.gz" | sha256sum -c -
        mkdir -p /workspace/bundle
        tar -xzf /workspace/bundle.tar.gz -C /workspace/bundle
        cat /workspace/bundle/meta.json

  # Every build starts on a fresh machine with no Docker cache, so the previous image is the cache:
  # without it each push reinstalls torch and downloads the speech model again. The first build has
  # no :latest to pull, hence the || true. BUILDKIT_INLINE_CACHE writes the few kB of cache metadata
  # BuildKit needs into the pushed image; the classic builder ignores it and uses the pulled layers.
  - id: cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [-c, docker pull $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest || true]

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=BUNDLE=bundle
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE]

  # 2 vCPU scores an attempt of a 3 s recording in 0.66 s, nearly all of it the speech model (see the
  # findings in ROADMAP-takk.md), so the concurrency is low and there is no GPU. The Anthropic key is
  # read from Secret Manager at start; without it the API runs and only stories are off.
  # _MIN_INSTANCES stays 0 for the free tier, which covers request-based billing only: the first
  # request after an idle period waits for the image and the 3.2 s the speech model takes to load.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --service-account=$_RUNTIME_SA
      - --set-secrets=ANTHROPIC_API_KEY=$_SECRET:latest
      # ^@^ is gcloud's own way of saying the list is split on @ rather than on a comma, which the
      # origins contain; without it the second origin is read as another variable and the deploy fails.
      - --set-env-vars=^@^TAKK_ORIGINS=$_ORIGINS
      - --cpu=2
      - --memory=4Gi
      - --concurrency=4
      - --timeout=120
      - --min-instances=$_MIN_INSTANCES
      - --allow-unauthenticated

# The default machine type, because the free tier's build minutes only cover that one; a bigger one
# would build faster and be billed from the first minute.
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
