<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign practice</title>
    <style>
      :root { color-scheme: dark; --bg: #16181d; --card: #23262e; --line: #363a45; --text: #e8eaee; --dim: #a0a6b2; --ok: #4ade80; --bad: #f87171; --accent: #60a5fa; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 900px; margin: 0 auto; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0 0 16px; }
      h2 { font-size: 32px; margin: 0; letter-spacing: 0.02em; }
      p { margin: 8px 0; }
      .dim { color: var(--dim); font-size: 14px; }
      input[type="search"] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px; }
      button { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--accent); color: #0b1220; font-size: 16px; font-weight: 600; cursor: pointer; }
      button.secondary { background: transparent; color: var(--text); font-weight: 400; padding: 6px 12px; }
      button:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      #matches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      .videos { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
      .videos video { width: 240px; border-radius: 8px; background: #000; }
      .videos figure { margin: 0; }
      .videos figcaption { display: flex; justify-content: space-between; align-items: center; }
      #results { margin: 8px 0; padding-left: 20px; }
      #view { position: relative; width: 100%; max-width: 560px; transform: scaleX(-1); }
      #camera { display: block; width: 100%; border-radius: 8px; background: #000; }
      #skeleton { position: absolute; inset: 0; width: 100%; height: 100%; }
      .recording { outline: 3px solid var(--bad); }
      #verdict { font-size: 22px; font-weight: 600; }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Practice a sign or a sentence</h1>
        <input id="search" type="search" placeholder="Search for a word" autocomplete="off" />
        <div id="matches"></div>
      </section>

      <section id="prompt" class="card hidden">
        <h2 id="sign"></h2>
        <p class="dim">Each search result you pick adds a sign; several make a sentence. Watch the clips, then record yourself signing them in order, lowering your hands between the signs. Press space to start and stop recording.</p>
        <button id="clear" class="secondary">Clear</button>
        <div id="references" class="videos"></div>
      </section>

      <section id="recorder" class="card hidden">
        <div id="view"><video id="camera" autoplay muted playsinline></video><canvas id="skeleton"></canvas></div>
        <p id="tracking" class="dim"></p>
        <p class="row">
          <button id="record" disabled>Record</button>
          <span id="timer" class="dim"></span>
          <label class="row dim">I sign with my <input type="radio" name="handedness" value="right" checked /> right <input type="radio" name="handedness" value="left" /> left hand</label>
        </p>
        <p id="verdict"></p>
        <ul id="results"></ul>
        <p id="detail" class="dim"></p>
      </section>
    </main>

    <script type="module">
      // Landmarks are extracted here, live, while the camera runs: MediaPipe's HolisticLandmarker in
      // VIDEO mode on the GPU (the CPU if the GPU is unavailable), with the same version and model as
      // extraction.py. Only the landmarks of a recording are sent to the server.
      import { FilesetResolver, HolisticLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

      // LANDMARK_SLICES in landmarks.py: [result field, first index, number of points]
      const PARTS = [
        ["faceLandmarks", 0, 468], // the face model's 10 iris points after these are dropped
        ["leftHandLandmarks", 468, 21],
        ["poseLandmarks", 489, 33],
        ["rightHandLandmarks", 522, 21],
      ];
      const N_LANDMARKS = 543;
      const SLOW_FPS = 20; // below this the extractor skips so many camera frames that results suffer

      const el = (id) => document.getElementById(id);
      const show = (id, visible) => el(id).classList.toggle("hidden", !visible);
      const word = (sign) => sign.replace(/^sts:/, "").replace(/-\d+$/, "");
      const COLORS = { left_hand: "#60a5fa", right_hand: "#f87171", upper_body: "#a0a6b2", lips: "#f472b6" };
      const id = (sign) => sign.match(/\d+$/)?.[0] ?? "";
      let signs = [], sentence = [], fps = 30, maxSeconds = 4, edges = {}, starting = null, landmarker = null, recorded = null;

      function search() {
        const query = el("search").value.trim().toLowerCase();
        const found = !query ? [] : signs.filter((s) => word(s.sign).toLowerCase().startsWith(query))
          .concat(signs.filter((s) => !word(s.sign).toLowerCase().startsWith(query) && word(s.sign).toLowerCase().includes(query)));
        el("matches").innerHTML = "";
        for (const s of found.slice(0, 40)) {
          const button = document.createElement("button");
          button.className = "secondary";
          button.textContent = `${word(s.sign)} (${id(s.sign)})`;
          button.onclick = () => choose([...sentence, s]);
          el("matches").append(button);
        }
      }

      async function choose(chosen) {
        sentence = chosen;
        el("sign").textContent = sentence.map((s) => word(s.sign)).join(" ");
        el("references").innerHTML = sentence
          .map((s, i) => `<figure><figcaption>${i + 1}. ${word(s.sign)}<button class="secondary" data-remove="${i}">Remove</button></figcaption>` +
            s.references.map((clip) => `<video src="/api/reference/${encodeURIComponent(clip)}" autoplay loop muted playsinline controls></video>`).join("") +
            "</figure>")
          .join("");
        clearResult();
        show("prompt", sentence.length > 0), show("recorder", sentence.length > 0);
        if (sentence.length) await (starting ??= startCamera()); // once, however fast signs are picked
      }

      function clearResult() {
        el("verdict").textContent = el("detail").textContent = el("results").innerHTML = "";
      }

      async function startCamera() {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
            audio: false,
          });
        } catch (error) {
          return (el("verdict").textContent = "No access to the camera: " + error.message);
        }
        el("camera").srcObject = stream;
        el("tracking").textContent = "Loading the landmark model...";
        const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm");
        let delegate = "GPU";
        try {
          landmarker = await HolisticLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: "/api/model", delegate }, runningMode: "VIDEO" });
        } catch {
          delegate = "CPU";
          landmarker = await HolisticLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: "/api/model", delegate }, runningMode: "VIDEO" });
        }
        track(delegate);
        el("record").disabled = false;
      }

      // The landmarks of one result in the common layout, NaN where a part was not detected.
      function layout(result) {
        const landmarks = new Float32Array(N_LANDMARKS * 3).fill(NaN);
        for (const [field, first, count] of PARTS) {
          const points = result[field][0];
          if (!points) continue;
          for (let k = 0; k < count; k++) landmarks.set([points[k].x, points[k].y, points[k].z], (first + k) * 3);
        }
        return landmarks;
      }

      // Draw one frame's landmarks (the common layout) over the camera image.
      function draw(landmarks) {
        const video = el("camera"), canvas = el("skeleton");
        (canvas.width = video.videoWidth), (canvas.height = video.videoHeight);
        const context = canvas.getContext("2d");
        context.lineWidth = 3;
        for (const [group, pairs] of Object.entries(edges)) {
          context.strokeStyle = COLORS[group];
          context.beginPath();
          for (const [a, b] of pairs) {
            if (Number.isNaN(landmarks[3 * a]) || Number.isNaN(landmarks[3 * b])) continue;
            context.moveTo(landmarks[3 * a] * canvas.width, landmarks[3 * a + 1] * canvas.height);
            context.lineTo(landmarks[3 * b] * canvas.width, landmarks[3 * b + 1] * canvas.height);
          }
          context.stroke();
        }
      }

      // Run the landmarker on every camera frame it can keep up with; frames that arrive while it is
      // busy are skipped. While recording, each result is kept with its frame's capture time.
      function track(delegate) {
        const video = el("camera");
        let last = -1, count = 0, since = performance.now();
        const next = (now, metadata) => {
          const time = metadata.captureTime ?? now;
          last = Math.max(last + 1, Math.round(time)); // VIDEO mode needs increasing timestamps
          const landmarks = layout(landmarker.detectForVideo(video, last));
          draw(landmarks);
          if (recorded) recorded.push({ time: time / 1000, landmarks });
          count += 1;
          if (now - since > 1000) {
            const rate = (count * 1000) / (now - since);
            const slow = rate < SLOW_FPS ? " — slower than the camera, so results are less reliable" : "";
            el("tracking").textContent = `Tracking live on the ${delegate} at ${rate.toFixed(0)} fps${slow}`;
            (count = 0), (since = now);
          }
          video.requestVideoFrameCallback(next);
        };
        video.requestVideoFrameCallback(next);
      }

      function record() {
        recorded = [];
        el("camera").classList.add("recording");
        el("record").textContent = "Stop";
        clearResult();
        const started = Date.now();
        window.ticker = setInterval(() => {
          const seconds = (Date.now() - started) / 1000;
          el("timer").textContent = `${seconds.toFixed(1)} s`;
          if (seconds > maxSeconds * sentence.length) stop();
        }, 100);
      }

      async function stop() {
        if (!recorded) return; // the time limit and the button can both stop a recording
        clearInterval(window.ticker);
        const frames = recorded;
        recorded = null;
        el("camera").classList.remove("recording");
        el("record").textContent = "Record";
        el("record").disabled = true;
        try {
          await score(frames);
        } finally {
          el("record").disabled = false;
        }
      }

      // The landmarks at the preparation's constant frame rate: at every 1 / fps seconds the latest
      // tracked frame, as the collection app's transcode picks video frames.
      function resample(frames) {
        const start = frames[0].time;
        const n = Math.floor((frames.at(-1).time - start) * fps) + 1;
        const landmarks = new Float32Array(n * N_LANDMARKS * 3);
        for (let i = 0, j = 0; i < n; i++) {
          while (j + 1 < frames.length && frames[j + 1].time <= start + i / fps) j++;
          landmarks.set(frames[j].landmarks, i * N_LANDMARKS * 3);
        }
        return landmarks;
      }

      async function score(frames) {
        if (frames.length < 2) return (el("verdict").textContent = "The recording is empty.");
        el("detail").textContent = "Scoring...";
        const body = new FormData();
        body.append("landmarks", new Blob([resample(frames).buffer]), "landmarks.f32");
        for (const s of sentence) body.append("sign", s.sign);
        body.append("handedness", document.querySelector("input[name=handedness]:checked").value);
        body.append("width", el("camera").videoWidth);
        body.append("height", el("camera").videoHeight);
        const response = await fetch("/api/attempt", { method: "POST", body });
        if (!response.ok) {
          el("verdict").className = "bad";
          el("verdict").textContent = "Scoring failed. Please record again.";
          el("detail").textContent = "";
          return;
        }
        const result = await response.json();
        el("detail").textContent = "";
        if (!result.signs.length) {
          el("verdict").className = "bad";
          el("verdict").textContent = result.note;
          return;
        }
        const correct = result.signs.filter((s) => s.correct).length;
        el("verdict").className = correct === result.signs.length ? "ok" : "bad";
        el("verdict").textContent = result.signs.length === 1
          ? (correct ? `Correct: that was ${word(result.signs[0].sign)}.` : `Not recognized as ${word(result.signs[0].sign)}.`)
          : `${correct} of ${result.signs.length} signs recognized.`;
        for (const s of result.signs) {
          const item = document.createElement("li");
          item.className = s.correct ? "ok" : "bad";
          if (!s.usable) item.textContent = `${word(s.sign)}: ${s.note}`;
          else {
            const closest = s.closest.sign === s.sign ? "also the closest sign in the lexicon" : `closest sign in the lexicon ${word(s.closest.sign)} (${id(s.closest.sign)}), score ${s.closest.score.toFixed(2)}`;
            item.textContent = `${s.correct ? "✓" : "✗"} ${word(s.sign)}: score ${s.score.toFixed(2)}, ${closest}. ${s.note === "Looks good." ? "" : s.note}`;
          }
          el("results").append(item);
        }
        el("detail").textContent = `A score of at least ${result.threshold.toFixed(2)} counts as the sign.`;
      }

      el("search").oninput = search;
      el("clear").onclick = () => choose([]);
      el("references").onclick = (event) => {
        const i = event.target.dataset.remove;
        if (i !== undefined) choose(sentence.filter((_, j) => j !== Number(i)));
      };
      el("record").onclick = () => (recorded ? stop() : record());
      // Space toggles recording; preventDefault also stops it clicking whichever button has focus.
      document.addEventListener("keydown", (event) => {
        if (event.code !== "Space" || event.target.type === "search") return;
        event.preventDefault();
        if (!event.repeat && !el("record").disabled) el("record").click();
      });

      fetch("/api/signs")
        .then((response) => response.json())
        .then((data) => ((signs = data.signs), (fps = data.fps), (maxSeconds = data.max_seconds), (edges = data.edges), search()));
    </script>
  </body>
</html>
