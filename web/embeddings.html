<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embedding explorer</title>
    <style>
      :root {
        color-scheme: dark; --bg: #16181d; --card: #23262e; --line: #363a45; --text: #e8eaee; --dim: #a0a6b2; --accent: #60a5fa; --other: #5b606b;
        --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
      header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 16px; margin: 0; }
      select, input, button { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
      button { cursor: pointer; }
      .dim { color: var(--dim); }
      #legend { display: flex; gap: 4px 12px; flex-wrap: wrap; padding: 6px 16px; border-bottom: 1px solid var(--line); min-height: 32px; }
      #legend span { cursor: pointer; white-space: nowrap; }
      #legend span.off { opacity: 0.35; }
      #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
      main { flex: 1; display: flex; min-height: 0; }
      #plot { flex: 1; position: relative; min-width: 0; }
      canvas { width: 100%; height: 100%; display: block; cursor: grab; }
      #tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; display: none; white-space: nowrap; }
      aside { width: 380px; overflow-y: auto; border-left: 1px solid var(--line); padding: 16px; }
      aside h2 { font-size: 22px; margin: 0 0 4px; word-break: break-word; }
      aside h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); margin: 18px 0 6px; }
      .videos { display: flex; gap: 6px; }
      .videos video { width: calc((100% - 12px) / 3); border-radius: 6px; background: #000; }
      .neighbor { display: grid; grid-template-columns: 1fr 44px 60px; gap: 8px; align-items: center; padding: 2px 0; cursor: pointer; }
      .neighbor:hover, .chip:hover { color: var(--accent); }
      .bar { height: 6px; border-radius: 3px; background: var(--accent); }
      .chip { display: inline-block; margin: 2px 8px 2px 0; cursor: pointer; }
      table { border-collapse: collapse; width: 100%; }
      td { padding: 2px 8px 2px 0; vertical-align: top; }
      td:first-child { color: var(--dim); }
      @media (max-width: 800px) { main { flex-direction: column; } aside { width: auto; height: 45%; border-left: 0; border-top: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <header>
      <h1>Embedding explorer</h1>
      <span id="run" class="dim"></span>
      <label>Color by <select id="feature"></select></label>
      <input id="search" list="signs" placeholder="Find a sign" autocomplete="off" />
      <datalist id="signs"></datalist>
      <button id="reset">Reset view</button>
    </header>
    <div id="legend"></div>
    <main>
      <div id="plot"><canvas id="canvas"></canvas><div id="tip"></div></div>
      <aside id="panel"><p class="dim">Each point is a sign (the mean of its clips' embeddings), laid out by t-SNE so that signs the model finds similar sit together. Hover a point for its name, click it for its clips and nearest signs. Drag to pan, scroll to zoom. Click a legend entry to show only that category.</p></aside>
    </main>
    <script>
      const css = getComputedStyle(document.documentElement);
      const PALETTE = [1, 2, 3, 4, 5, 6, 7, 8].map((i) => css.getPropertyValue(`--s${i}`).trim());
      const OTHER = css.getPropertyValue("--other").trim();
      const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d"), tip = document.getElementById("tip");
      let points = [], view = { scale: 1, x: 0, y: 0 }, colors = [], categoryOf = [], isolated = null, selected = null, hovered = null;

      const value = (p, feature) => (p[feature] ?? "unknown") + "";
      const toScreen = (p) => [p.x * view.scale + view.x, -p.y * view.scale + view.y];

      function fit() {
        const xs = points.map((p) => p.x), ys = points.map((p) => -p.y), w = canvas.clientWidth, h = canvas.clientHeight;
        const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
        view.scale = 0.92 * Math.min(w / (x1 - x0), h / (y1 - y0));
        view.x = w / 2 - view.scale * (x0 + x1) / 2;
        view.y = h / 2 - view.scale * (y0 + y1) / 2;
      }

      // Clusters get one of the eight colors, chosen to differ from the nearest clusters' colors.
      function clusterColors() {
        const centers = new Map();
        for (const p of points) {
          const c = centers.get(p.cluster) ?? { x: 0, y: 0, n: 0 };
          c.x += p.x; c.y += p.y; c.n += 1; centers.set(p.cluster, c);
        }
        const ids = [...centers.keys()], color = new Map();
        for (const id of ids) {
          const c = centers.get(id);
          const near = ids.filter((o) => color.has(o))
            .sort((a, b) => dist(centers.get(a), c) - dist(centers.get(b), c)).slice(0, 7).map((o) => color.get(o));
          color.set(id, PALETTE.find((col) => !near.includes(col)) ?? PALETTE[id % PALETTE.length]);
        }
        return color;
      }
      const dist = (a, b) => Math.hypot(a.x / a.n - b.x / b.n, a.y / a.n - b.y / b.n);

      function setFeature(feature) {
        isolated = null;
        const legend = document.getElementById("legend");
        legend.innerHTML = "";
        if (feature === "cluster") {
          const color = clusterColors();
          colors = points.map((p) => color.get(p.cluster));
          categoryOf = points.map(() => null);
          legend.innerHTML = `<span class="dim">${color.size} clusters of similar signs (colors only tell neighbouring clusters apart). Click a sign to see its cluster.</span>`;
        } else {
          const counts = new Map();
          for (const p of points) counts.set(value(p, feature), (counts.get(value(p, feature)) ?? 0) + 1);
          const ranked = [...counts.keys()].filter((v) => v !== "unknown").sort((a, b) => counts.get(b) - counts.get(a));
          const slot = new Map(ranked.slice(0, PALETTE.length).map((v, i) => [v, i]));
          categoryOf = points.map((p) => (slot.has(value(p, feature)) ? value(p, feature) : value(p, feature) === "unknown" ? "unknown" : "other"));
          colors = categoryOf.map((c) => (slot.has(c) ? PALETTE[slot.get(c)] : OTHER));
          const entries = [...slot.keys()].map((v) => [v, PALETTE[slot.get(v)], counts.get(v)]);
          const rest = ranked.slice(PALETTE.length);
          if (rest.length) entries.push(["other", OTHER, rest.reduce((n, v) => n + counts.get(v), 0), `${rest.length} other values`]);
          if (counts.has("unknown")) entries.push(["unknown", OTHER, counts.get("unknown")]);
          for (const [category, col, n, label] of entries) {
            const item = document.createElement("span");
            item.innerHTML = `<i style="background:${col}"></i>${label ?? category} <span class="dim">${n}</span>`;
            item.onclick = () => {
              isolated = isolated === category ? null : category;
              for (const el of legend.children) el.classList.toggle("off", isolated !== null && el !== item);
              draw();
            };
            legend.appendChild(item);
          }
        }
        draw();
      }

      function draw() {
        const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
        if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        const sel = selected === null ? null : points[selected];
        const neighbors = new Set(sel ? sel.neighbors.map(([j]) => j) : []);
        const dimmed = (i) => (isolated !== null && categoryOf[i] !== isolated) || (sel !== null && points[i].cluster !== sel.cluster && !neighbors.has(i) && i !== selected);

        if (sel) {
          const [sx, sy] = toScreen(sel);
          for (const [j, sim] of sel.neighbors) {
            const [x, y] = toScreen(points[j]);
            ctx.strokeStyle = `rgba(232, 234, 238, ${Math.max(0.15, sim) * 0.8})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(x, y); ctx.stroke();
          }
        }
        for (const pass of [true, false]) {
          for (let i = 0; i < points.length; i++) {
            if (dimmed(i) !== pass) continue;
            const [x, y] = toScreen(points[i]);
            if (x < -10 || y < -10 || x > w + 10 || y > h + 10) continue;
            ctx.globalAlpha = pass ? 0.15 : 1;
            ctx.fillStyle = colors[i];
            ctx.beginPath(); ctx.arc(x, y, i === selected ? 7 : 4, 0, 2 * Math.PI); ctx.fill();
            if (!pass) { ctx.strokeStyle = "#16181d"; ctx.lineWidth = 1; ctx.stroke(); }
          }
        }
        ctx.globalAlpha = 1;

        // Labels: the selection and its neighbours, and every visible point once zoomed in far enough.
        const visible = points.map((p, i) => i).filter((i) => {
          const [x, y] = toScreen(points[i]);
          return x >= 0 && y >= 0 && x <= w && y <= h && !dimmed(i);
        });
        const labeled = new Set(visible.length <= 300 ? visible : []);
        if (sel) { labeled.add(selected); neighbors.forEach((j) => labeled.add(j)); }
        if (hovered !== null) labeled.delete(hovered);
        ctx.font = "12px system-ui, sans-serif";
        ctx.fillStyle = "#e8eaee"; ctx.strokeStyle = "#16181d"; ctx.lineWidth = 3;
        for (const i of labeled) {
          const [x, y] = toScreen(points[i]);
          ctx.font = i === selected ? "bold 14px system-ui, sans-serif" : "12px system-ui, sans-serif";
          ctx.strokeText(points[i].sign, x + 7, y + 4); ctx.fillText(points[i].sign, x + 7, y + 4);
        }
      }

      function pointAt(mx, my) {
        let best = null, bestD = 10;
        for (let i = 0; i < points.length; i++) {
          const [x, y] = toScreen(points[i]), d = Math.hypot(x - mx, y - my);
          if (d < bestD) { best = i; bestD = d; }
        }
        return best;
      }

      function select(i) {
        selected = i;
        const panel = document.getElementById("panel");
        if (i === null) { draw(); return; }
        const p = points[i], feature = document.getElementById("feature").value;
        const members = points.map((q, j) => j).filter((j) => points[j].cluster === p.cluster && j !== i);
        const phonology = Object.keys(p).filter((k) => k.startsWith("phonology.") && p[k] !== null);
        panel.innerHTML = `
          <h2>${p.sign}</h2>
          <div class="dim">${p.dataset} · ${p.split ?? "no split"} · ${p.n_clips} clips · cluster ${p.cluster}</div>
          <div class="videos">${p.shown.map((c) => `<video src="/api/video/${encodeURIComponent(c)}" autoplay muted loop playsinline></video>`).join("")}</div>
          <h3>Nearest signs (cosine similarity)</h3>
          ${p.neighbors.map(([j, sim]) => `<div class="neighbor" data-i="${j}"><span>${points[j].sign}${points[j].cluster === p.cluster ? "" : ' <span class="dim">↗</span>'}</span><span class="dim">${sim.toFixed(2)}</span><div class="bar" style="width:${Math.max(0, sim) * 60}px"></div></div>`).join("")}
          <h3>Cluster ${p.cluster} (${members.length + 1} signs)</h3>
          <div>${members.map((j) => `<span class="chip" data-i="${j}">${points[j].sign}</span>`).join("")}</div>
          ${phonology.length ? `<h3>ASL-LEX phonology</h3><table>${phonology.map((k) => `<tr><td>${k.slice(10)}</td><td>${p[k]}</td></tr>`).join("")}</table>` : ""}`;
        panel.querySelectorAll("[data-i]").forEach((el) => (el.onclick = () => goTo(+el.dataset.i)));
        draw();
      }

      function goTo(i) {
        view.scale = Math.max(view.scale, 3 * fitScale);
        const [x, y] = toScreen(points[i]);
        view.x += canvas.clientWidth / 2 - x; view.y += canvas.clientHeight / 2 - y;
        select(i);
      }

      let drag = null, fitScale = 1;
      canvas.onmousedown = (e) => (drag = { x: e.offsetX, y: e.offsetY, moved: false });
      canvas.onmousemove = (e) => {
        if (drag) {
          const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
          if (drag.moved || Math.hypot(dx, dy) > 3) {
            drag.moved = true; view.x += dx; view.y += dy; drag.x = e.offsetX; drag.y = e.offsetY;
            canvas.style.cursor = "grabbing"; draw(); return;
          }
        }
        const i = pointAt(e.offsetX, e.offsetY);
        if (i !== hovered) { hovered = i; draw(); }
        if (i === null) { tip.style.display = "none"; return; }
        const feature = document.getElementById("feature").value;
        tip.innerHTML = `<b>${points[i].sign}</b> <span class="dim">${feature.replace("phonology.", "")}: ${value(points[i], feature)}</span>`;
        tip.style.display = "block"; tip.style.left = e.offsetX + 12 + "px"; tip.style.top = e.offsetY + 12 + "px";
      };
      window.onmouseup = (e) => {
        if (drag && !drag.moved && e.target === canvas) select(pointAt(e.offsetX, e.offsetY));
        drag = null; canvas.style.cursor = "grab";
      };
      canvas.onmouseleave = () => { tip.style.display = "none"; hovered = null; draw(); };
      canvas.onwheel = (e) => {
        e.preventDefault();
        const factor = Math.exp(-e.deltaY * 0.0015);
        view.x = e.offsetX - (e.offsetX - view.x) * factor; view.y = e.offsetY - (e.offsetY - view.y) * factor;
        view.scale *= factor; draw();
      };
      window.onresize = draw;
      document.getElementById("reset").onclick = () => { fit(); draw(); };
      document.getElementById("feature").onchange = (e) => setFeature(e.target.value);
      document.getElementById("search").onchange = (e) => {
        const i = points.findIndex((p) => p.sign.toLowerCase() === e.target.value.trim().toLowerCase());
        if (i >= 0) goTo(i);
      };

      fetch("/api/data").then((r) => r.json()).then((data) => {
        points = data.points;
        document.getElementById("run").textContent = `${data.run} · ${points.length} signs`;
        document.getElementById("feature").innerHTML = data.features.map((f) => `<option value="${f}">${f.replace("phonology.", "")}</option>`).join("");
        document.getElementById("signs").innerHTML = points.map((p) => `<option value="${p.sign}">`).join("");
        fit(); fitScale = view.scale;
        setFeature("cluster");
      });
    </script>
  </body>
</html>
