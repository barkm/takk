[project]
name = "isolated-sign-validation"
version = "0.1.0"
requires-python = ">=3.12"
# What the TAKK app needs to serve a bundle; the deployed image installs these alone (see
# ROADMAP-takk.md step 18). scikit-learn is here because transformers imports it.
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
takk = "takk.main:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12"]
build-backend = "uv_build"

# Two packages in one repository: the ISV model and data work, and the TAKK app built on it.
[tool.uv.build-backend]
module-name = ["isolated_sign_validation", "takk"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]
# Landmark extraction, the datasets and the figures: everything but the app needs these, and
# `uv sync` installs them here as before. The image is built with --no-default-groups.
data = [
    "matplotlib>=3.11.2",
    "mediapipe>=1.0.1",
    "yt-dlp[default]>=2026.8.19",
]

[tool.uv]
default-groups = ["dev", "data"]
