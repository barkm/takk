[project]
name = "isolated-sign-validation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.11.2",
    "mediapipe>=1.0.1",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.53.0",
    "yt-dlp[default]>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]
