[project]
name = "isolated-sign-verification"
version = "0.1.0"
requires-python = ">=3.12"
# What the TAKK app needs to serve a bundle; the deployed image installs these alone.
# scikit-learn is here because transformers imports it.
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
takk = "takk.main:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12"]
build-backend = "uv_build"

# Three packages in one repository: the sign data, the ISV model built on it, and the TAKK app built on both.
[tool.uv.build-backend]
module-name = ["sign_data", "isolated_sign_verification", "takk"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]
# Landmark extraction, the datasets and the figures: everything but the app needs these, and
# `uv sync` installs them here as before. The image is built with --no-default-groups.
data = [
    "matplotlib>=3.11.2",
    "mediapipe>=1.0.1",
]

[tool.uv]
default-groups = ["dev", "data"]

[tool.pytest.ini_options]
filterwarnings = [
    # Training's DataLoader workers fork a process torch has started threads in. Forking is chosen:
    # the workers share the prepared frames copy-on-write, where spawn or forkserver would copy
    # gigabytes into each of them. Outside pytest a DeprecationWarning from multiprocessing is not shown.
    "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks:DeprecationWarning",
]
